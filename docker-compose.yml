version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Compras Públicas — Pipeline Analytics
#
# Serviços:
#   postgres  → banco de dados (Ubuntu 24.04 + PostgreSQL 17)
#   dbt       → transformações (staging → intermediate → marts)
#   pgadmin   → interface visual para consultas no PostgreSQL
#
# Rede: todos os serviços compartilham a rede "compras_network"
#
# Uso:
#   docker compose up postgres -d                      # sobe o banco
#   docker compose up pgadmin -d                       # sobe o PgAdmin
#   docker compose run --rm dbt dbt seed               # carrega CSVs
#   docker compose run --rm dbt dbt build              # transforma + testa
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: compras_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-compras_publicas}
      POSTGRES_USER:     ${POSTGRES_USER:-cp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cp_pass}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/17/main
      - pglog:/var/log/postgresql
    networks:
      - compras_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-compras_publicas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgAdmin 4 ────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: compras_pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@compras.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      TZ: America/Sao_Paulo
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - compras_network

  # ── DBT Core ─────────────────────────────────────────────────────────────
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: compras_dbt
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      POSTGRES_HOST:     postgres
      # Porta interna do container postgres na rede Docker — não é a porta
      # exposta no host (essa vem de POSTGRES_PORT/.env, ver ports: do
      # serviço postgres). Fixa em 5432 independente do mapeamento externo.
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-compras_publicas}
      POSTGRES_USER:     ${POSTGRES_USER:-cp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cp_pass}
    volumes:
      - ./dbt:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - compras_network
    profiles: ["dbt"]

  # ── Pipeline de ingestão (spec 009/015/019) ─────────────────────────────────
  # Mesma imagem publicada em produção (Dockerfile.pipeline) — aqui só para
  # teste local de ingest.sh de ponta a ponta. Em produção quem sobe este
  # container é docker-compose.pipeline.yml no repo infra (privado), via
  # crontab do host, não este arquivo.
  #
  # ./logs:/var/log/compras-publicas — mesmo volume usado pro log da rotina
  # (LOG_DIR em ingest.sh) e pro arquivo de quarentena (spec 019, mesmo
  # diretório, sem volume adicional necessário) — sobrevive ao --rm do
  # container efêmero.
  pipeline:
    build:
      context: .
      dockerfile: dbt/Dockerfile.pipeline
    container_name: compras_pipeline
    env_file: .env
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-compras_publicas}
      POSTGRES_USER:     ${POSTGRES_USER:-cp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cp_pass}
    volumes:
      - ./logs:/var/log/compras-publicas
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - compras_network
    profiles: ["pipeline"]

# ── Rede compartilhada ───────────────────────────────────────────────────────
networks:
  compras_network:
    driver: bridge

# ── Volumes persistentes ─────────────────────────────────────────────────────
volumes:
  pgdata:
  pglog:
  pgadmin_data: