# Ponte pro Postgres compartilhado, fora do k3s (container Docker no host,
# rede bridge própria). Mesmo padrão de arquivo usado por jeysel-auth (cada
# projeto mantém sua própria cópia de Service+Endpoints, não compartilhada
# via kustomize base comum). weather-analytics NÃO declara este recurso —
# não faz parte deste padrão.
#
# Migração em andamento (2026-08-26): `postgres` (nome genérico) é o
# Service/Endpoints original, hoje declarado idêntico neste repo e em
# jeysel.dev -- nome e namespace idênticos fazem as duas Applications do
# Argo CD (jeysel-auth-* e compras-publicas-*) disputarem a posse do objeto
# (OutOfSync intermitente por tracking-id, achado real, spec 083/084,
# pendencias.md do repo infra). `postgres-compras-publicas` é o nome
# próprio novo, sem colisão. As duas declarações convivem até o
# `POSTGRES_HOST` deste app apontar pro nome novo (fase de cutover) e o
# `DATABASE_URL` de jeysel-auth apontar pro dele -- só depois disso a
# declaração `postgres` sai daqui e do outro repo. NÃO remover `postgres`
# sozinho enquanto essa migração não estiver concluída nos dois apps -- ver
# histórico completo em docs/steering/pendencias.md (repo infra).
#
# IP confirmado ao vivo via `docker inspect postgres` em 2026-08-21 (ver
# spec 022, Requirement 6) — já mudou uma vez antes, não presumir estável
# entre um restart/recriação do container e outro.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  labels:
    app: postgres
subsets:
  - addresses:
      - ip: 172.18.0.2
    ports:
      - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-compras-publicas
  labels:
    app: postgres-compras-publicas
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-compras-publicas
  labels:
    app: postgres-compras-publicas
subsets:
  - addresses:
      - ip: 172.18.0.2
    ports:
      - port: 5432
