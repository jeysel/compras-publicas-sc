# Ponte pro Postgres compartilhado, fora do k3s (container Docker no host,
# rede bridge própria). weather-analytics NÃO declara este recurso — não
# faz parte deste padrão.
#
# A declaração genérica `postgres` (Service/Endpoints) saiu deste arquivo em
# 2026-08-26 (spec 086, repo infra) -- ela agora é mantida exclusivamente
# pela Application de plataforma `infra-platform-{staging,production}`
# (repo infra, deploy/k8s/platform/), dona única do recurso compartilhado.
# Este app continua consumindo o Service `postgres` normalmente por nome
# DNS -- só parou de *declará-lo* em git. Histórico completo do conflito de
# ownership que motivou isso: docs/steering/pendencias.md e spec 083/084/086
# do repo infra.
#
# `postgres-compras-publicas` abaixo é resíduo de uma tentativa anterior de
# correção (não autorizada, ver spec 083) -- Service sem seletor, mesmo sem
# nenhum consumidor real apontando pra ele hoje. Remoção agendada como parte
# da mesma spec 086 (limpeza de "Services fantasma"), não removido ainda
# neste commit para não acumular duas mudanças de risco diferente no mesmo
# push.
apiVersion: v1
kind: Service
metadata:
  name: postgres-compras-publicas
  labels:
    app: postgres-compras-publicas
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-compras-publicas
  labels:
    app: postgres-compras-publicas
subsets:
  - addresses:
      - ip: 172.18.0.2
    ports:
      - port: 5432
