apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# c5dfabd (filtro de ano/intervalo em 5 endpoints + paginação 30->15, spec 028)
# validado em staging em 2026-08-24: pod Running (0 restarts) na tag nova,
# regressão checada nos 3 endpoints com WHERE novo (qualidade-dado-orgao 414/
# variacao-custo-modalidade 18/variacao-prazo-modalidade 1 linhas sem filtro,
# idêntico ao dado de dev), filtro de ano confirmado restringindo (qualidade-
# dado-orgao?ano_inicio=2020&ano_fim=2020 -> 105/414), paginação confirmada via
# clique real no "Ver mais" (15 linhas iniciais -> 30 após 1 clique),
# confirmação visual das 5 páginas via Playwright + port-forward (dropdowns de
# ano populados 2016-2026, combinação com filtro de órgão/modalidade preserva
# ambos, 0 erros de console). Mudança só de código API/frontend (3 endpoints
# existentes ganharam WHERE novo), sem alteração de model dbt — não precisa de
# dbt run/test seletivo antes de promover.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: c5dfabd
