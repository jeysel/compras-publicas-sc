apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# ef10ab4 (responsividade mobile, paginação client-side de 30 em 30 nos 3
# relatórios, ORDER BY em Contratos/Contratos c/ aditivo) validado em staging
# via Playwright em 2026-08-21: sem overflow horizontal a 375px em 4 páginas,
# paginação com "Ver mais" funcional (414 linhas em qualidade-dado-orgao),
# ordenação desc confirmada em qualidade-dado-orgao (Contratos) e
# variacao-custo-modalidade (Contratos c/ aditivo).
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: ef10ab4
