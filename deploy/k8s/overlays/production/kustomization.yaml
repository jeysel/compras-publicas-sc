apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# 12d21e2 (ordenação decrescente + filtro de período dt_inicio_de/dt_inicio_ate
# no relatório fornecedor-por-segmento; sem mudança de mart dbt) validado em
# staging em 2026-08-25: ORDER BY nu_contrato DESC confirmado, filtro de
# período restringindo corretamente (93803 -> 5467 linhas no intervalo
# 2020-01-01/2020-12-31), os 118 registros com dt_inicio NULL sempre inclusos
# (com e sem filtro), 0 registros fora do intervalo vazando. Página do
# relatório em 200.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: 12d21e2
