apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# aab8e3a (filtros interativos de orgao/modalidade nos 4 graficos) validado em
# staging em 2026-08-24: pod Running/Healthy na tag nova, filtro confirmado
# via API (escalada-custo?cod_unidade_gestora=920021 retornou 43/43 registros,
# todos com o código filtrado, contra 1000 sem filtro), confirmação visual dos
# 4 gráficos no navegador via port-forward. Mudança só de código API/frontend,
# sem alteração de model dbt — não precisa de dbt run/test seletivo antes de
# promover.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: aab8e3a
