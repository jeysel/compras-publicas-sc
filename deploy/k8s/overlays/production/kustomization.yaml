apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# d8aeacb (grão novo em ConcentracaoFornecedor + filtro de ano em 4 endpoints,
# spec 029) validado em staging em 2026-08-24: dbt run seletivo (4 models:
# int_concentracao_fornecedor_estado, int_concentracao_fornecedor_por_orgao,
# mart_concentracao_fornecedor, mart_diversidade_vencedores) + dbt test
# completo 108/108 sem erro. mart_concentracao_fornecedor com 46.305 linhas
# (grão novo), confirmado determinístico via --full-refresh (table models,
# sempre full rebuild). Staging e production compartilham o mesmo Postgres
# (postgres/compras_publicas, confirmado via secret compras-publicas-api-secret
# em ambos namespaces) — dbt já rodou contra o dado compartilhado, não precisa
# repetir para production. Pod Running (0 restarts) na tag nova, load test 50
# requisições sem crescimento de memória. Validação funcional dos 4 endpoints
# com/sem filtro (ano_inicio/ano_fim, não "ano" — parâmetro correto do router)
# confirmando resultados diferentes entre filtrado/não filtrado. Confirmação
# visual das 4 páginas via Playwright + túnel SSH duplo (0 erros de console,
# canvas renderizado em todas, filtro de ano no dropdown dispara requisição
# correta e re-renderiza o gráfico).
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: d8aeacb
