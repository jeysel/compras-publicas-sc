apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# 2 réplicas em produção (levantamento de connection pool do Postgres
# compartilhado, repo infra) -- elimina o gap de ~80-90s sem replica de
# backup a cada restart de liveness. App é stateless (API de leitura, sem
# sessão local).
replicas:
  - name: compras-publicas-api
    count: 2

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# 7effec3 (filtro de período em escalada-custo/fornecedor-por-segmento, rename
# de rótulo "Ano inicial/final" -> "A partir de/Até", alinhamento visual dos
# date pickers, e ocultação do relatório de variação de prazo do menu; sem
# mudança de mart dbt) validado em staging em 2026-08-25: filtros
# ano_inicio/ano_fim e dt_inicio_de retornando dados reais em 200, rótulo "A
# partir de" presente e "Ano inicial" ausente em diversidade-vencedores e
# qualidade-dado-orgao, rota variacao-prazo-modalidade ainda em 200 mas
# ausente da home/menu. Confirmação visual (date pickers, dark mode, menu)
# feita pelo usuário.
# 0096c52 (repo infra): /health criado do zero (não existia -- probes
# apontavam para / antes, que nunca tocava o banco, exatamente a rota que
# respondeu 200 o tempo todo durante o incidente de 27/08 enquanto todo
# /api/v1/* travava com o pool preso). Agora testa SELECT 1 via
# get_connection() (pool real de app/db.py), readinessProbe/livenessProbe
# apontam para /health com timeoutSeconds/failureThreshold explícitos.
# Validado em staging (28/08/2026) com teste de falha controlada real:
# iptables DROP escopado ao IP do pod -> IP do postgres:5432 (host,
# temporário, removido depois), readinessProbe detectou em 35s,
# livenessProbe reiniciou o pod sozinho em 81s, recuperação completa
# (/health 200) poucos segundos após remover o bloqueio -- restartCount
# final 1, sem efeito nos outros sites/pods.
# a39f3db (spec 034 -- fronteira de cobertura temporal 2016): piso
# GREATEST(MIN(ano_assinatura), 2016) em /api/v1/anos-disponiveis +
# paragrafo na metodologia sobre a exclusao pre-2016. O corte no dbt
# (stg_contratos) so tem efeito nos KPIs/series apos rodar o pipeline
# manual no servidor (cron gated por ETag nao pega mudanca so de codigo,
# spec 030). Validado em staging em 2026-09-03 (exec no pod, DB
# compartilhado ainda sem reprocessamento dbt): /api/v1/anos-disponiveis
# -> {"ano_min":2016,"ano_max":2026} (era 1994); /metodologia contem o
# paragrafo novo; kpis-resumo/escalada-custo ainda 104.574 (esperado ate
# o dbt build); contratos-temporal, concentracao-fornecedor e /health em
# 200, sem regressao.
# e781ee3 (spec 035 -- footer de 3 colunas): layout.html troca o footer de
# linha unica pelo de 3 colunas (marca / Navegacao / Contato) + barra
# inferior com copyright, "Codigo e dados sob licenca aberta" e
# Privacidade/Termos (href="#"). So frontend, sem toque em dbt/marts.
# Validado local (Postgres real) e em staging em 2026-09-03: /metodologia
# serve <footer class="site-footer"> com o grid, link /relatorios/
# perfil-orgaos presente, CSS built com .site-footer__* e sem .footer-inner;
# colapso p/ 1 coluna em tela estreita e dark mode conferidos por
# screenshot local (mesmo codigo). Sem regressao nas rotas.
# 6c3f625 (adendo spec 035): footer -- "Codigo e dados sob licenca aberta"
# vira link pro LICENSE do repo; links Privacidade/Termos (href="#")
# removidos (app sem auth/form/sessao). Tambem: LICENSE MIT na raiz +
# secao de licenca no README (nao afetam o runtime). So frontend.
# Validado local e em staging 2026-09-03: footer com grid, link
# blob/main/LICENSE presente, Privacidade/Termos ausentes.
# 10098d8 (spec 036 -- tratamento mobile consistente em eixo monetario/pizza):
# escalada-custo.ts e contratos-temporal.ts ganham grid/containLabel
# responsivo + notacao compacta de BRL em mobile (mesmo padrao ja usado em
# concentracao-fornecedor.ts); diversidade-vencedores.ts troca rotulo
# externo da pizza (truncava em "..." mesmo com so 2 categorias) por
# legenda na base. So frontend, sem toque em dbt/marts. Validado local
# (Postgres real, screenshot Playwright/Chromium 375px antes/depois) e em
# staging 2026-10-06 (exec no pod): /health 200, /api/v1/anos-disponiveis
# 200 com dado real, bundle main-DTxGoK9F.js confirmado como o mesmo
# validado localmente (contem notacao "compact"). Teste em iPhone real
# (Safari) fica para o usuario validar agora que esta em producao -- a
# investigacao do "grafico encolhido em iPhone" (comentario
# "Fix especulativo" no codigo) segue em aberto, nao fechada por este
# deploy.
# cb00467 (spec 037 -- combobox/input de filtro vazando da tela em mobile):
# achado pelo usuario em iPhone real ao validar a spec 036 em producao --
# select "Orgao" vazava horizontalmente. Causa: select nativo sem
# width/max-width se dimensiona pela option mais longa (nome de orgao),
# e item de flex (.filter-field) nao encolhe abaixo do conteudo por padrao
# (min-width: auto). Fix so em web/src/style.css (.filter-field min-width: 0
# + width/max-width/box-sizing nos campos dentro do media query mobile),
# sem tocar HTML/TS -- afeta todo combobox/input do projeto, nao so
# "Orgao". Validado local: bug reproduzido de verdade via git stash
# temporario do CSS + Playwright/Chromium 375px (scrollWidth 626 vs
# clientWidth 375 antes, select de Orgao com 610px); restaurado o fix,
# mesmo teste da scrollWidth = clientWidth = 375, incl. caso extremo com a
# option mais longa do seed real ("Administracao do Porto de Sao
# Francisco do Sul") selecionada. Validado em staging 2026-10-06 (exec no
# pod): /health 200, bundle main-BtywNKSo.css confirmado como o mesmo
# validado localmente. So frontend, sem toque em dbt/marts.
# 493af7b (spec 038 -- rede de seguranca contra overflow horizontal em
# mobile): usuario reportou o mesmo vazamento da spec 037 no input de data
# de fornecedor-por-segmento. DIFERENTE da 037, a causa NAO foi confirmada
# -- nao reproduziu em Chromium nem WebKit desktop (Playwright), com ou
# sem valor no campo. Tentativa de fix direcionado (-webkit-appearance:
# none no input de data) foi implementada, testada e REVERTIDA na mesma
# sessao por quebrar visualmente o campo em WebKit (icone/placeholder
# somem). No lugar: overflow-x: hidden no body, contendo qualquer
# vazamento horizontal sem depender do mecanismo exato. Validado:
# sticky nav intacto, sem overflow nos engines testaveis, sem mudanca
# visual nos campos (staging 2026-10-06, bundle main-DjjVkpqS.css
# confirmado). NAO VALIDADO: o bug relatado em si -- sem acesso a iPhone
# real nesta sessao, fica pendente confirmacao do usuario apos este
# deploy (ver docs/specs/038-mobile-overflow-rede-seguranca/spec.md).
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: 493af7b
