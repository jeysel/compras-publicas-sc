apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml

# 2 réplicas em produção (levantamento de connection pool do Postgres
# compartilhado, repo infra) -- elimina o gap de ~80-90s sem replica de
# backup a cada restart de liveness. App é stateless (API de leitura, sem
# sessão local).
replicas:
  - name: compras-publicas-api
    count: 2

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag deve ser um SHA
# já validado em staging, não necessariamente o mesmo do primeiro deploy.
#
# 7effec3 (filtro de período em escalada-custo/fornecedor-por-segmento, rename
# de rótulo "Ano inicial/final" -> "A partir de/Até", alinhamento visual dos
# date pickers, e ocultação do relatório de variação de prazo do menu; sem
# mudança de mart dbt) validado em staging em 2026-08-25: filtros
# ano_inicio/ano_fim e dt_inicio_de retornando dados reais em 200, rótulo "A
# partir de" presente e "Ano inicial" ausente em diversidade-vencedores e
# qualidade-dado-orgao, rota variacao-prazo-modalidade ainda em 200 mas
# ausente da home/menu. Confirmação visual (date pickers, dark mode, menu)
# feita pelo usuário.
# 0096c52 (repo infra): /health criado do zero (não existia -- probes
# apontavam para / antes, que nunca tocava o banco, exatamente a rota que
# respondeu 200 o tempo todo durante o incidente de 27/08 enquanto todo
# /api/v1/* travava com o pool preso). Agora testa SELECT 1 via
# get_connection() (pool real de app/db.py), readinessProbe/livenessProbe
# apontam para /health com timeoutSeconds/failureThreshold explícitos.
# Validado em staging (28/08/2026) com teste de falha controlada real:
# iptables DROP escopado ao IP do pod -> IP do postgres:5432 (host,
# temporário, removido depois), readinessProbe detectou em 35s,
# livenessProbe reiniciou o pod sozinho em 81s, recuperação completa
# (/health 200) poucos segundos após remover o bloqueio -- restartCount
# final 1, sem efeito nos outros sites/pods.
# a39f3db (spec 034 -- fronteira de cobertura temporal 2016): piso
# GREATEST(MIN(ano_assinatura), 2016) em /api/v1/anos-disponiveis +
# paragrafo na metodologia sobre a exclusao pre-2016. O corte no dbt
# (stg_contratos) so tem efeito nos KPIs/series apos rodar o pipeline
# manual no servidor (cron gated por ETag nao pega mudanca so de codigo,
# spec 030). Validado em staging em 2026-09-03 (exec no pod, DB
# compartilhado ainda sem reprocessamento dbt): /api/v1/anos-disponiveis
# -> {"ano_min":2016,"ano_max":2026} (era 1994); /metodologia contem o
# paragrafo novo; kpis-resumo/escalada-custo ainda 104.574 (esperado ate
# o dbt build); contratos-temporal, concentracao-fornecedor e /health em
# 200, sem regressao.
# e781ee3 (spec 035 -- footer de 3 colunas): layout.html troca o footer de
# linha unica pelo de 3 colunas (marca / Navegacao / Contato) + barra
# inferior com copyright, "Codigo e dados sob licenca aberta" e
# Privacidade/Termos (href="#"). So frontend, sem toque em dbt/marts.
# Validado local (Postgres real) e em staging em 2026-09-03: /metodologia
# serve <footer class="site-footer"> com o grid, link /relatorios/
# perfil-orgaos presente, CSS built com .site-footer__* e sem .footer-inner;
# colapso p/ 1 coluna em tela estreita e dark mode conferidos por
# screenshot local (mesmo codigo). Sem regressao nas rotas.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: e781ee3
