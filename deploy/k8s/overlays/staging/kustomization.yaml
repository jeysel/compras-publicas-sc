apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- ../../base
- ingress.yaml

# newTag abaixo é atualizado automaticamente pelo CI a cada push em main
# (spec 089, job build-api de .github/workflows/build-and-push.yml —
# `kustomize edit set image` + commit `[skip ci]` + push, seguido de sync
# automático via Argo CD, já que compras-publicas-staging tem
# automated/selfHeal desde a spec 089). Não editar manualmente em condições
# normais — qualquer edição manual será sobrescrita no próximo push em main.
# Produção continua com promoção manual (ver overlays/production, sem
# automated/selfHeal, spec 015).
images:
- name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
  newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
  newTag: 0096c52
