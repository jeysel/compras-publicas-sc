apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag abaixo aponta pro
# build de compras-publicas-api no GHCR (tag 12d21e2 — ordenação decrescente +
# filtro de período dt_inicio_de/dt_inicio_ate no relatório fornecedor-por-
# segmento; tag == HEAD do push == GITHUB_SHA do build, confirmado via
# `gh run list`/`gh run view` (run 32795532550, conclusion success). Sem
# mudança de model dbt nesta promoção — só API + frontend. Atualizar aqui a
# cada novo SHA que se queira validar em staging.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: 12d21e2
