apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

# Mecanismo de promoção manual (item 3, revisão de deployment.yaml): produção
# não deve seguir `latest` automaticamente (spec 015). newTag abaixo aponta pro
# build de compras-publicas-api no GHCR (tag 064bbd0 — spec 026: KPIs resumo,
# perfil de fornecedores/órgãos, correção de fl_valor_suspeito em
# dim_orgaos/dim_fornecedores; tag == HEAD do push == GITHUB_SHA do build,
# confirmado via `gh run list --commit`/`gh run watch` (run 32737043137,
# conclusion success)). dbt run/test seletivo (int_contratos_por_orgao/
# _fornecedor, dim_orgaos, dim_fornecedores, fct_contratos) já rodado contra o
# Postgres compartilhado (staging=produção, mesmo banco — achado da spec 026)
# via container avulso da imagem compras-publicas-pipeline:064bbd0, 22/22
# dbt test PASS, sum(vl_total_atual) em dim_fornecedores confirmado em
# R$47.214.663.449,40 (valor limpo esperado).
# Atualizar aqui a cada novo SHA que se queira validar em staging.
images:
  - name: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newName: ghcr.io/jeysel/compras-publicas-sc/compras-publicas-api
    newTag: 064bbd0
