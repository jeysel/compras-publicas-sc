# ─────────────────────────────────────────────────────────────────────────────
# Build e publicação de imagens (spec 015)
#
# Publica no GHCR, autenticado via GITHUB_TOKEN (sem PAT externo). Cada
# imagem tem seu próprio job (Requirement funcional 4 da spec 015) — a de
# ingestão (spec 009) e a da API+frontend (spec 012/022).
#
# Não promove produção automaticamente (Requirement funcional 6 da spec
# 015) — só builda e publica; qual tag roda em produção é decisão manual,
# fora deste workflow.
# ─────────────────────────────────────────────────────────────────────────────
name: Build e publica imagens

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "api/**"
      - "web/**"
      - ".github/workflows/build-and-push.yml"

jobs:
  build-pipeline:
    name: Imagem de ingestão
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag do SHA curto
        id: tags
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dbt/Dockerfile.pipeline
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/compras-publicas-pipeline:${{ steps.tags.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/compras-publicas-pipeline:latest

  build-api:
    name: Imagem da API+frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Postgres real, exigido pelo smoke test (spec 089): api/app/db.py abre o
    # pool com wait=True no startup (`await pool.open(wait=True)`), diferente
    # de outros apps deste cluster com engine lazy -- sem um Postgres real
    # alcançável, o container nem termina de subir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag do SHA curto
        id: tags
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (local, sem push ainda)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/compras-publicas-api:latest

      - name: Sobe container efêmero para smoke test
        # --network host: o Service de postgres acima é exposto em
        # localhost:5432 do runner; sem host networking, o container do
        # smoke test não alcançaria essa porta (namespace de rede próprio).
        run: |
          docker run -d --name compras-publicas-smoke-test --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=smoke \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_PASSWORD=smoke \
            ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}

      - name: Aguarda container ficar pronto
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "Container pronto após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout aguardando / responder"
          docker logs compras-publicas-smoke-test
          exit 1

      - name: Smoke test da rota /
        # Mesma rota já usada pelas probes de k8s (deploy/k8s/base/deployment.yaml)
        # como definição operacional de "saudável" -- sem introduzir uma rota
        # /health nova só para o CI (spec 089).
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)
          if [ "$code" != "200" ]; then
            echo "FALHA: / retornou ${code} (esperado 200)"
            docker logs compras-publicas-smoke-test
            exit 1
          fi
          echo "OK: / -> 200"

      - name: Limpa container de smoke test
        if: always()
        run: docker rm -f compras-publicas-smoke-test || true

      - name: Publica imagem no GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
          docker push ghcr.io/${{ github.repository }}/compras-publicas-api:latest

      - name: Instala kustomize
        run: |
          curl -fSL --retry 5 --retry-delay 2 --retry-connrefused \
            -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz
          rm kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Atualiza tag da imagem no overlay de staging
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/${{ github.repository }}/compras-publicas-api=ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet && exit 0
          # [skip ci]: evita loop -- este commit também casa com o gatilho push:main
          git commit -m "deploy(staging): atualiza imagem compras-publicas-api para ${{ steps.tags.outputs.sha_short }} [skip ci]"
          git push
