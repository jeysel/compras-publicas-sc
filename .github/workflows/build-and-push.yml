# ─────────────────────────────────────────────────────────────────────────────
# Build e publicação de imagens (spec 015)
#
# Publica no GHCR, autenticado via GITHUB_TOKEN (sem PAT externo). Cada
# imagem tem seu próprio job (Requirement funcional 4 da spec 015) — a de
# ingestão (spec 009) e a da API+frontend (spec 012/022).
#
# Não promove produção automaticamente (Requirement funcional 6 da spec
# 015) — só builda e publica; qual tag roda em produção é decisão manual,
# fora deste workflow.
# ─────────────────────────────────────────────────────────────────────────────
name: Build e publica imagens

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "api/**"
      - "web/**"
      - ".github/workflows/build-and-push.yml"

jobs:
  test:
    name: Suíte de testes da API (spec 033)
    runs-on: ubuntu-latest
    # Postgres real como serviço — mesmo padrão do smoke test do job build-api
    # (não mockado, Requirement funcional 3 da spec 033).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cp_test
          POSTGRES_PASSWORD: cp_test
          POSTGRES_DB: cp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: cp_test
      POSTGRES_USER: cp_test
      POSTGRES_PASSWORD: cp_test
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dbt e dependências de teste da API
        run: |
          pip install dbt-core==1.9.* dbt-postgres==1.9.*
          pip install -r api/requirements-dev.txt

      - name: Resolve dependências dbt (dbt_utils)
        working-directory: dbt
        run: dbt deps

      # Substitui dbt/seeds/contratos.csv só neste checkout efêmero do
      # runner — nunca commitado; mesmo mecanismo já usado em produção
      # (scripts/ingest.sh sobrescreve o mesmo arquivo antes de dbt seed/
      # build). Fonte de verdade do seed de teste: api/tests/fixtures/contratos.py.
      - name: Gera seed de teste determinístico
        run: python api/tests/fixtures/contratos.py dbt/seeds/contratos.csv

      - name: dbt seed + dbt build (schema marts real, populado do zero)
        working-directory: dbt
        run: |
          dbt seed --select contratos --full-refresh
          dbt build

      - name: Executa a suíte de testes (pytest -m integration + testes rápidos)
        working-directory: api
        run: pytest -v

  build-pipeline:
    name: Imagem de ingestão
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag do SHA curto
        id: tags
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dbt/Dockerfile.pipeline
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/compras-publicas-pipeline:${{ steps.tags.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/compras-publicas-pipeline:latest

  build-api:
    name: Imagem da API+frontend
    runs-on: ubuntu-latest
    # Requirement funcional 1/2 da spec 033: suíte de testes roda antes do
    # build e bloqueia publicação no GHCR/promoção pro overlay de staging
    # se falhar. build-pipeline (imagem dbt) não depende de test — a suíte
    # cobre só a API, pipeline de ingestão é fora do escopo (spec 033).
    needs: test
    permissions:
      contents: write
      packages: write
    # Postgres real, exigido pelo smoke test (spec 089): api/app/db.py abre o
    # pool com wait=True no startup (`await pool.open(wait=True)`), diferente
    # de outros apps deste cluster com engine lazy -- sem um Postgres real
    # alcançável, o container nem termina de subir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag do SHA curto
        id: tags
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (local, sem push ainda)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/compras-publicas-api:latest

      - name: Sobe container efêmero para smoke test
        # --network host: o Service de postgres acima é exposto em
        # localhost:5432 do runner; sem host networking, o container do
        # smoke test não alcançaria essa porta (namespace de rede próprio).
        run: |
          docker run -d --name compras-publicas-smoke-test --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=smoke \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_PASSWORD=smoke \
            ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}

      - name: Aguarda container ficar pronto
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Container pronto após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout aguardando /health responder"
          docker logs compras-publicas-smoke-test
          exit 1

      - name: Smoke test da rota /health
        # /health agora existe e testa SELECT 1 através do pool real (ver
        # pendencias.md, repo infra) -- mesma rota usada pelas probes de k8s
        # (deploy/k8s/base/deployment.yaml). O Postgres real deste job (acima)
        # garante que o pool consiga abrir/consultar de verdade, não só que o
        # processo esteja de pé.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)
          if [ "$code" != "200" ]; then
            echo "FALHA: /health retornou ${code} (esperado 200)"
            docker logs compras-publicas-smoke-test
            exit 1
          fi
          echo "OK: /health -> 200"

      - name: Limpa container de smoke test
        if: always()
        run: docker rm -f compras-publicas-smoke-test || true

      - name: Publica imagem no GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
          docker push ghcr.io/${{ github.repository }}/compras-publicas-api:latest

      - name: Instala kustomize
        run: |
          curl -fSL --retry 5 --retry-delay 2 --retry-connrefused \
            -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz
          rm kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Atualiza tag da imagem no overlay de staging
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/${{ github.repository }}/compras-publicas-api=ghcr.io/${{ github.repository }}/compras-publicas-api:${{ steps.tags.outputs.sha_short }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet && exit 0
          # [skip ci]: evita loop -- este commit também casa com o gatilho push:main
          git commit -m "deploy(staging): atualiza imagem compras-publicas-api para ${{ steps.tags.outputs.sha_short }} [skip ci]"
          git push
